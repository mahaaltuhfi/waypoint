{% extends "base.html" %}

{% block content %}
<h1>Report a Trail</h1>

<form method="post">
    {% csrf_token %}
    <label>Name:</label>
    <input type="text" name="name">

    <label>Email:</label>
    <input type="email" name="email">

    <label>Trail:</label>
    <input type="text" name="trail">

    <label>Note:</label>
    <textarea name="note"></textarea>

    <button type="submit">Submit</button>
</form>

{% endblock %}
