{% extends "base.html" %}

{% block content %}
<h1>Search</h1>
<form method="get">
    <input type="text" name="q" placeholder="Search trails" value="{{ query }}">
    <button type="submit">Go</button>
</form>

{% if query %}
    <p>Results for "{{ query }}":</p>
{% endif %}

<ul>
    {% for trail in trails %}
        <li>{{ trail.name }}</li>
    {% endfor %}
</ul>
{% endblock %}
